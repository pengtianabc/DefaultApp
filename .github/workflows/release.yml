name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: ./build.sh

      - name: Package DMG (with Applications symlink)
        run: |
          mkdir -p dist
          cp -R DefaultApp.app dist/
          ln -s /Applications dist/Applications
          hdiutil create -volname "DefaultApp" -srcfolder dist -ov -format UDZO DefaultApp.dmg

      - name: Package ZIP
        run: ditto -c -k --keepParent DefaultApp.app DefaultApp.zip

      - name: Stage CLI binary
        run: cp .build/defaultapp defaultapp && chmod +x defaultapp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DefaultApp.dmg
            DefaultApp.zip
            defaultapp
          generate_release_notes: true
