name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: ./build.sh

      - name: Package DMG (with Applications symlink)
        run: |
          mkdir -p dist
          cp -R DefType.app dist/
          ln -s /Applications dist/Applications
          hdiutil create -volname "DefType" -srcfolder dist -ov -format UDZO DefType.dmg

      - name: Package ZIP
        run: ditto -c -k --keepParent DefType.app DefType.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DefType.dmg
            DefType.zip
          generate_release_notes: true
