name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app & CLI
        run: ./build.sh

      - name: Smoke test LaunchServices CLI
        run: |
          ./.build/defaultapp get txt || true   # exit 1 = real mismatch finding, CLI itself works
          ./.build/defaultapp get txt --json || true
          ./.build/defaultapp list png
          ./.build/defaultapp version
          ./.build/defaultapp help >/dev/null

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: DefaultApp-app
          path: DefaultApp.app
          if-no-files-found: error
